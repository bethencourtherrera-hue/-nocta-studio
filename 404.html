<title>Página no encontrada | Nocta Studio</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='16' cy='16' r='14' stroke='%2338421F' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23C9A227'/%3E%3C/svg%3E">

<style>
:root{
  --crema:#F7F3E8;--crema-alt:#ECE5D3;
  --oliva:#38421F;--ocre:#C9A227;--ocre-oscuro:#96701A;--ocre-texto:#7F5C12;
  --texto:#38421F;--texto-suave:#5E6B3F;--sobre-ocre:#2E3516;
  --f-display:'Instrument Serif',Georgia,serif;
  --f-body:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--crema)}
body{font-family:var(--f-body);background:var(--crema);color:var(--texto);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'404';position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);font-family:var(--f-display);font-size:clamp(14rem,60vw,34rem);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(56,66,31,.1);pointer-events:none;user-select:none}
main{position:relative;max-width:520px}
.brand{font-family:var(--f-display);font-size:1.5rem;letter-spacing:3px;color:var(--oliva);text-decoration:none;display:inline-block;margin-bottom:36px}
.brand span{color:var(--ocre-oscuro)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,10vw,4.4rem);line-height:1.02;color:var(--oliva);margin-bottom:16px}
h1 em{color:var(--ocre-oscuro)}
p{font-size:1.05rem;color:var(--texto-suave);line-height:1.7;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ocre);color:var(--sobre-ocre);padding:15px 28px;border-radius:100px;font-size:.95rem;font-weight:700;text-decoration:none;border:2px solid var(--ocre);min-height:48px;transition:all .3s}
.btn:hover{background:var(--oliva);border-color:var(--oliva);color:var(--crema);transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--oliva);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a href="/" class="brand" aria-label="Nocta Studio, ir al inicio">NOCTA <span>STUDIO</span></a>
  <h1>Esta página <em>no existe</em></h1>
  <p>Puede que el enlace esté roto o que la página haya cambiado de sitio. Vuelve al inicio y lo encuentras.</p>
  <a href="/" class="btn">Volver al inicio <span aria-hidden="true">→</span></a>
</main>
</body>
